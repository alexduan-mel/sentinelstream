[project]
name = "sentinelstream"
version = "0.1.0"
description = "Research assistant that alerts on material SEC filings for a watchlist."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "psycopg2-binary>=2.9.10,<3",
  "defusedxml>=0.7.1,<1",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff==0.17.6",
  "black==26.10.1",
]

[tool.uv]
# This is an application, not a library: install dependencies only.
package = false

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "web/"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["alerts", "api", "filings", "ingestion", "ledger", "orchestration", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
