# Base Compose file shared by local development and the EC2 host.
# Run from the repo root with `docker compose up --build` (compose.yaml includes this file).

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SENTINELSTREAM_VERSION: ${SENTINELSTREAM_VERSION:-dev}
    # Settings come only from env files (.env locally, Parameter Store on EC2), so nothing here can
    # silently override them.
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # The image entrypoint applies migrations before the API starts, so Postgres must be up first.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB come from the same env file as the app's.
    env_file:
      - path: ../../.env
        required: false
    # Local data lives in a named volume; on EC2 the prod file binds the EBS data volume instead.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Over TCP on purpose: during first-time init the image runs a socket-only server, and a socket
    # check would report ready before the real server is up. No port is published to the host.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
