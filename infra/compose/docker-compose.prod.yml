# Production overrides for the EC2 host. Applied on top of docker-compose.yml by infra/deploy/deploy.sh:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --no-build
# Images come from ECR (tagged by commit SHA), secrets from SSM Parameter Store, logs go to CloudWatch.

x-cloudwatch-logs: &cloudwatch-logs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:?set by deploy.sh}
    awslogs-group: /sentinelstream/app
    tag: "{{.Name}}"

# api, scheduler, worker and research-worker: the same ECR image and settings.
x-app: &app
  image: ${SENTINELSTREAM_IMAGE:?set by deploy.sh}
  env_file:
    - path: /run/sentinelstream/app.env
      required: true
  logging: *cloudwatch-logs

services:
  api: *app
  scheduler: *app
  worker: *app
  research-worker: *app

  postgres:
    env_file:
      - path: /run/sentinelstream/app.env
        required: true
    # The separate EBS data volume (ADR 0001), mounted at /srv/sentinelstream by the instance's
    # user data. It survives instance replacement and is snapshotted daily. deploy.sh refuses to
    # start if it is not mounted, so Postgres never initialises an empty cluster on the root disk.
    volumes:
      - /srv/sentinelstream/postgres:/var/lib/postgresql/data
    logging: *cloudwatch-logs
