name: AWS OIDC test

# Smoke test for the GitHub Actions → AWS OIDC connection.
# Assumes the IAM role in AWS_ROLE_ARN and prints the caller identity.
# No AWS keys are stored anywhere; credentials are short-lived and come from OIDC.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/aws-test.yml

permissions:
  id-token: write # required to request the OIDC token
  contents: read

concurrency:
  group: aws-test-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check role ARN is configured
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Repository secret AWS_ROLE_ARN is not set (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-aws-test-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Prints only the role name, never the account ID (this repo's logs are public).
      - name: Verify assumed role
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"
          ROLE_NAME="$(aws sts get-caller-identity --query Arn --output text | cut -d/ -f2)"
          echo "Authenticated to AWS in $AWS_REGION as role: $ROLE_NAME"
